#
# End-to-end suite (frontend/e2e, Playwright) against a freshly built extension.
#
# Opt-in, not on every push: start it from the Actions tab ("Run workflow"),
# or add the `run-e2e` label to a PR — it then also re-runs on every push to
# that PR until the label is removed. Locally: `cd frontend && pnpm test:e2e`.
#
# Tests tagged @network (live Overture S3 / PMTiles) are skipped here.
#
name: E2E
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright suite
    # Manual runs always; PR events only while the PR carries `run-e2e` (and,
    # for a `labeled` event, only when that label is the one just added).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'run-e2e') &&
       (github.event.action != 'labeled' || github.event.label.name == 'run-e2e'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build extension
        run: make configure release

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node with pnpm cache
        uses: actions/setup-node@v4
        with:
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install

      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run suite
        working-directory: frontend
        run: pnpm test:e2e --grep-invert @network

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
