#
# Builds and tests the `gis` extension on every distribution platform, with
# DuckDB's extension-ci-tools (the same toolchain community-extensions uses).
#
# The extension targets DuckDB's stable C extension API (v1.2.0, see the
# Makefile), so one build per platform serves every supported DuckDB version.
# Compatibility.yml runs the tests against each supported DuckDB version.
#
# This takes ~10 min (mostly rebuilding the Linux toolchain image), so on pull
# requests it only runs when native code or build files change. Frontend-only
# PRs are covered by Compatibility.yml (which embeds frontend/dist and tests
# the extension natively) and Frontend.yml; every push to main runs it.
#
# There are deliberately no deploy jobs here. Distribution is handled by
# duckdb/community-extensions: that repo builds, signs and publishes the
# extension from the ref pinned in its extensions/gis/description.yml.
#
# wasm is excluded everywhere: the extension runs a threaded HTTP server, which
# has no wasm equivalent. Keep this in sync with `excluded_platforms` in the
# community-extensions description.yml.
#
name: Main Extension Distribution Pipeline
on:
  pull_request:
    paths:
      - 'src/**'
      - 'third_party/**'
      - 'duckdb_capi/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'extension-ci-tools'
      - '.github/workflows/MainDistributionPipeline.yml'
  push:
    branches:
      - 'main'
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-build:
    name: Build GIS extension
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads'
      # Intel macOS is opt-in in extension-ci-tools v2.0; build it (best effort,
      # cross-compiled on an Apple-silicon runner).
      opt_in_archs: 'osx_amd64'
      extension_name: gis
      extra_toolchains: python3

