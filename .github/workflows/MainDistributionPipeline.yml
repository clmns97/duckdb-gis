#
# Builds and tests the `gis` extension.
#
# The extension targets DuckDB's stable C extension API (v1.2.0, see the
# Makefile), so one build per platform serves every supported DuckDB version:
# the distribution job builds and tests it against the latest DuckDB, and the
# compatibility job runs the tests against each DuckDB version we support.
#
# There are deliberately no deploy jobs here. Distribution is handled by
# duckdb/community-extensions: that repo builds, signs and publishes the
# extension from the ref pinned in its extensions/gis/description.yml.
#
# wasm is excluded everywhere: the extension runs a threaded HTTP server, which
# has no wasm equivalent. Keep this in sync with `excluded_platforms` in the
# community-extensions description.yml.
#
name: Main Extension Distribution Pipeline
on:
  pull_request:
    paths-ignore:
      - '.github/workflows/TypeScriptWorkspace.yml'
      - 'docs/**'
      - 'ts/**'
      - 'README.md'
  push:
    branches:
      - 'main'
    paths-ignore:
      - '.github/workflows/TypeScriptWorkspace.yml'
      - 'docs/**'
      - 'ts/**'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-build:
    name: Build GIS extension
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads'
      extension_name: gis
      extra_toolchains: python3

  compatibility:
    name: Test on DuckDB ${{ matrix.duckdb }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release (1.4 LTS), the last 1.x, and the latest.
        duckdb: ['1.4.5', '1.5.6', '2.0.0']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build
        run: make configure release DUCKDB_TEST_VERSION=${{ matrix.duckdb }}
      - name: Test
        run: make test_release DUCKDB_TEST_VERSION=${{ matrix.duckdb }}
