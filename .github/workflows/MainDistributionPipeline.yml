#
# Builds and tests the `gis` extension against the DuckDB versions we support.
#
# There are deliberately no deploy jobs here. Distribution is handled by
# duckdb/community-extensions: that repo builds, signs and publishes the
# extension from the ref pinned in its extensions/gis/description.yml. Upstream
# duckdb-ui deployed to DuckDB Labs' own extension repository, which we have
# neither credentials nor cause to write to.
#
# wasm is excluded everywhere: the extension runs a threaded HTTP server, which
# has no wasm equivalent. Keep this in sync with `excluded_platforms` in the
# community-extensions description.yml.
#
name: Main Extension Distribution Pipeline
on:
  pull_request:
    paths-ignore:
      - '.github/workflows/TypeScriptWorkspace.yml'
      - 'docs/**'
      - 'ts/**'
      - 'README.md'
  push:
    branches:
      - 'main'
    paths-ignore:
      - '.github/workflows/TypeScriptWorkspace.yml'
      - 'docs/**'
      - 'ts/**'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-main-build:
    name: Build GIS extension for main branch
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      ci_tools_version: main
      duckdb_version: main
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads'
      extension_name: gis

  duckdb-next-patch-build:
    name: Build GIS extension for next patch (v1.5-variegata)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      ci_tools_version: v1.5-variegata
      duckdb_version: v1.5-variegata
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads'
      extension_name: gis

  duckdb-stable-build:
    name: Build GIS extension for DuckDB v1.5.4
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      ci_tools_version: v1.5-variegata
      duckdb_version: v1.5.4
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads'
      extension_name: gis

  duckdb-lts-next-patch-build:
    name: Build GIS extension binaries for next LTS patch (v1.4-andium)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.4-andium
    with:
      ci_tools_version: v1.4-andium
      duckdb_version: v1.4-andium
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads'
      extension_name: gis
      vcpkg_commit: '84bab45d415d22042bd0b9081aea57f362da3f35'

  duckdb-lts-build:
    name: Build GIS extension for DuckDB v1.4.5 (LTS)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.4-andium
    with:
      ci_tools_version: v1.4-andium
      duckdb_version: v1.4.5
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads'
      extension_name: gis
      vcpkg_commit: '84bab45d415d22042bd0b9081aea57f362da3f35'
